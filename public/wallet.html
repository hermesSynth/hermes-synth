<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wallet — Hermes Synth</title>
  <link rel="icon" type="image/png" href="/logo.png?v=4">
  <meta name="theme-color" content="#ffffff">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'JetBrains Mono', 'SF Mono', Menlo, monospace;
      background: #ffffff;
      color: #0f172a;
      min-height: 100vh;
      overflow-x: hidden;
    }
    
    .page { position: relative; z-index: 1; padding: 0 0 80px 0; }
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 24px;
    }
    .topbar .badge {
      background: #ffffff;
      border: 1px solid rgba(0,51,255,0.3);
      color: #0033ff;
      font-size: 11px; font-weight: 600;
      letter-spacing: 2px; text-transform: uppercase;
      padding: 6px 16px; border-radius: 4px;
      display: flex; align-items: center; gap: 8px;
    }
    .topbar .badge img { width: 20px; height: 20px; }
    .topbar .menu-btn {
      background: #ffffff;
      border: 1px solid rgba(0,51,255,0.1);
      color: #0f172a;
      width: 40px; height: 40px; border-radius: 8px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; text-decoration: none;
    }
    .hero { padding: 8px 24px 20px; }
    .hero h1 {
      font-family: 'JetBrains Mono', monospace;
      font-size: 32px; font-weight: 400; line-height: 1.15; color: #0f172a;
    }
    .hero h1 span { color: #0033ff; }
    .hero p {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px; color: rgba(15,23,42,0.5); margin-top: 8px;
    }
    .card {
      margin: 0 24px 16px;
      border: 1px solid rgba(0,51,255,0.08);
      border-radius: 12px; padding: 24px;
      background: #ffffff;
    }
    .card h3 {
      font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
      color: rgba(15,23,42,0.5); margin-bottom: 16px;
    }
    .field { margin-bottom: 20px; }
    .field label {
      display: block; font-size: 11px; letter-spacing: 2px;
      text-transform: uppercase; color: rgba(15,23,42,0.5); margin-bottom: 10px;
    }
    .field input, .field select, .field textarea {
      width: 100%;
      background: #ffffff;
      border: 1px solid rgba(0,51,255,0.12);
      border-radius: 8px; padding: 14px 16px;
      font-size: 14px;
      font-family: 'JetBrains Mono', 'SF Mono', Menlo, monospace;
      color: #0f172a; outline: none;
      transition: border-color 0.2s;
    }
    .field input:focus, .field select:focus, .field textarea:focus { border-color: rgba(0,51,255,0.5); }
    .field input::placeholder, .field textarea::placeholder { color: rgba(15,23,42,0.3); }
    .field select option { background: #ffffff; }
    .field textarea { min-height: 80px; resize: vertical; }
    .btn-primary {
      width: 100%; padding: 14px;
      background: #0033ff;
      color: #ffffff; border: none; border-radius: 8px;
      font-size: 13px; font-weight: 700;
      letter-spacing: 2px; text-transform: uppercase;
      cursor: pointer; transition: opacity 0.2s;
      font-family: 'JetBrains Mono', monospace;
    }
    .btn-primary:hover { opacity: 0.9; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-secondary {
      padding: 10px 20px;
      background: #ffffff;
      border: 1px solid rgba(0,51,255,0.1);
      color: #0f172a; border-radius: 8px;
      font-size: 12px; font-weight: 600;
      cursor: pointer; transition: all 0.2s;
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: 1px; text-transform: uppercase;
    }
    .btn-secondary:hover { border-color: rgba(0,51,255,0.3); }
    .btn-danger {
      padding: 10px 20px;
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.3);
      color: #ef4444; border-radius: 8px;
      font-size: 12px; font-weight: 600;
      cursor: pointer;
      font-family: 'JetBrains Mono', monospace;
    }
    .item-card {
      background: #ffffff;
      border: 1px solid rgba(0,51,255,0.1);
      border-radius: 8px; padding: 16px;
      margin-bottom: 10px; cursor: pointer;
      transition: all 0.2s;
    }
    .item-card:hover { border-color: rgba(0,51,255,0.3); background: rgba(0,51,255,0.05); }
    .item-card .name { font-size: 14px; font-weight: 600; color: #0f172a; }
    .item-card .desc { font-size: 12px; color: rgba(15,23,42,0.5); margin-top: 4px; }
    .item-card .meta { font-size: 10px; color: rgba(15,23,42,0.4); margin-top: 8px; display: flex; gap: 12px; letter-spacing: 1px; text-transform: uppercase; }
    .badge-sm {
      font-size: 9px; padding: 2px 8px; border-radius: 3px;
      font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase;
    }
    .badge-sm.active { background: rgba(52,211,153,0.15); color: #34d399; }
    .badge-sm.paused { background: #ffffff; color: #0033ff; }
    .empty-state {
      text-align: center; padding: 40px 20px; color: rgba(15,23,42,0.4);
    }
    .empty-state h3 { font-size: 16px; color: rgba(15,23,42,0.5); margin-bottom: 8px; font-family: Georgia, serif; }
    .modal-overlay {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85); z-index: 100;
      align-items: center; justify-content: center; padding: 16px;
    }
    .modal-overlay.show { display: flex; }
    .modal {
      background: #ffffff;
      border: 1px solid rgba(0,51,255,0.08);
      border-radius: 12px; padding: 24px;
      width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto;
    }
    .modal h2 { font-family: Georgia, serif; font-size: 20px; margin-bottom: 20px; }
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: #ffffff;
      border-top: 1px solid rgba(0,51,255,0.08);
      display: flex; justify-content: space-around;
      padding: 10px 0 14px; z-index: 10;
    }
    .bottom-nav a {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      text-decoration: none; color: rgba(15,23,42,0.4);
      font-size: 10px; font-family: 'JetBrains Mono', monospace;
      transition: color 0.2s;
    }
    .bottom-nav a:hover, .bottom-nav a.active { color: #0033ff; }
    .bottom-nav img { width: 22px; height: 22px; }
    @media (max-width: 480px) {
      .hero { padding: 8px 12px 12px; }
      .hero h1 { font-size: 22px; }
      .hero p { font-size: 12px; }
      .chat-card { margin: 0 8px; }
      .input-area { padding: 8px 10px; }
    }
    @media (min-width: 768px) {
      .page { max-width: 700px; margin: 0 auto; }
      .bottom-nav { max-width: 600px; left: 50%; transform: translateX(-50%); border-radius: 12px 12px 0 0; }
    }

    .balance-card {
      text-align: center; margin: 0 24px 20px;
      border: 1px solid rgba(0,51,255,0.08); border-radius: 12px;
      padding: 24px; background: #ffffff;
    }
    .balance-card .label { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: rgba(15,23,42,0.5); }
    .balance-card .amount { font-size: 36px; font-weight: 700; color: #0033ff; margin: 8px 0; font-family: Georgia, serif; }
    .balance-card .sub { font-size: 12px; color: rgba(15,23,42,0.4); }
    .actions { display: flex; gap: 8px; margin: 0 24px 20px; }
    .action-btn {
      flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px;
      padding: 12px; background: #ffffff; border: 1px solid rgba(0,51,255,0.1);
      border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 600;
      color: #0f172a; transition: all 0.2s; font-family: 'JetBrains Mono', monospace;
      letter-spacing: 1px; text-transform: uppercase;
    }
    .action-btn:hover { border-color: rgba(0,51,255,0.3); }
    .action-btn img { width: 18px; height: 18px; }
    .section-title {
      font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
      color: rgba(15,23,42,0.4); margin: 0 24px 12px; font-weight: 600;
    }
    .api-keys { margin: 0 24px 20px; }
    .key-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px; background: #ffffff; border: 1px solid rgba(0,51,255,0.1);
      border-radius: 8px; margin-bottom: 8px;
    }
    .key-name { font-size: 12px; font-weight: 600; }
    .key-value { font-size: 11px; color: rgba(15,23,42,0.4); font-family: 'JetBrains Mono', monospace; }
    .key-status { font-size: 9px; letter-spacing: 1px; text-transform: uppercase; color: #34d399; }
    .add-key-btn {
      width: 100%; padding: 10px; background: #ffffff;
      border: 1px dashed rgba(0,51,255,0.12); border-radius: 8px;
      color: rgba(15,23,42,0.5); font-size: 12px; cursor: pointer;
      font-family: 'JetBrains Mono', monospace;
    }
    .tx-list { margin: 0 24px; }
    .tx-item {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 0; border-bottom: 1px solid rgba(0,51,255,0.08);
    }
    .tx-icon { font-size: 18px; }
    .tx-info { flex: 1; }
    .tx-name { font-size: 13px; font-weight: 500; }
    .tx-date { font-size: 11px; color: rgba(15,23,42,0.4); }
    .tx-amount { font-size: 14px; font-weight: 600; }
    .tx-amount.credit { color: #34d399; }
    .tx-amount.debit { color: #ef4444; }
  </style>
  <link rel="stylesheet" href="/responsive.css">
</head>
<body>
  <div class="page">
    <div class="topbar">
      <div class="badge"><img src="/logo.png?v=4" alt="HC">WALLET</div>
      <a href="/chat" class="menu-btn" title="Dashboard">☰</a>
    </div>
    <div class="hero">
      <h1>Your <span>Wallet.</span></h1>
      <p>Manage billing, credits, and payments.</p>
    </div>
    </div>

  <div class="card">
    <div class="balance-card">
      <div class="label">TOTAL CREDITS</div>
      <div class="amount" id="balance">0.00 <span>credits</span></div>
      <div class="sub" id="planInfo">Loading...</div>
    </div>

    <div class="actions">
      <button class="action-btn" onclick="window.location.href='/upgrade'">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        <div class="label">ADD CREDITS</div>
      </button>
      <button class="action-btn" onclick="showUsage()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        <div class="label">USAGE</div>
      </button>
      <button class="action-btn" onclick="window.location.href='/env'">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.78 7.78 5.5 5.5 0 0 1 7.78-7.78zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>
        <div class="label">API KEYS</div>
      </button>
    </div>

    <div class="section-title">API KEYS</div>
    <div class="api-keys" id="apiKeys">
      <div class="key-item">
        <div>
          <div class="key-name">Venice AI</div>
          <div class="key-value">Bundled — No key required</div>
        </div>
        <span class="key-status">ACTIVE</span>
      </div>
    </div>
    <button class="add-key-btn" onclick="addApiKey()">+ ADD API KEY</button>

    <br><br>
    <div class="section-title">RECENT TRANSACTIONS</div>
    <div class="tx-list" id="txList">
      <div class="tx-item">
        <div class="tx-info">
          <div class="tx-icon credit">+</div>
          <div>
            <div class="tx-name">Free Trial Credits</div>
            <div class="tx-date">Account creation</div>
          </div>
        </div>
        <div class="tx-amount credit">+100.00</div>
      </div>
    </div>
  </div>
  </div>

  <nav class="bottom-nav">
    <a href="/chat"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>Chat</a>
    <a href="/agents"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="4"/><circle cx="9" cy="16" r="1" fill="currentColor"/><circle cx="15" cy="16" r="1" fill="currentColor"/></svg>Agents</a>
    <a href="/editor"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>Editor</a>
    <a href="/terminal"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>Terminal</a>
    <a href="/mcp"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M12 12h.01"/><path d="M17 12h.01"/><path d="M7 12h.01"/></svg>MCP</a>
    <a href="/settings" class="active"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="3"/><path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>Settings</a>
    <a href="/profile"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>Profile</a>
  </nav>

<script>
    async function loadWallet() {
      try {
        const res = await fetch('/api/wallet');
        const data = await res.json();
        document.getElementById('balance').innerHTML = (data.balance || 100).toFixed(2) + ' <span>credits</span>';
        const plan = data.plan || 'free_trial';
        document.getElementById('planInfo').textContent = plan === 'premium' ? 'Premium Plan — Unlimited credits' : 'Free Trial — 100 credits included';

        // Load transactions
        const txList = document.getElementById('txList');
        if (data.transactions && data.transactions.length > 0) {
          txList.innerHTML = data.transactions.map(tx => `
            <div class="tx-item">
              <div class="tx-info">
                <div class="tx-icon ${tx.amount >= 0 ? 'credit' : 'debit'}">${tx.amount >= 0 ? '+' : '-'}</div>
                <div>
                  <div class="tx-name">${tx.description || tx.type}</div>
                  <div class="tx-date">${new Date(tx.created_at?.replace(' ','T')+'Z').toLocaleDateString()}</div>
                </div>
              </div>
              <div class="tx-amount ${tx.amount >= 0 ? 'credit' : 'debit'}">${tx.amount >= 0 ? '+' : ''}${tx.amount.toFixed(2)}</div>
            </div>
          `).join('');
        }

        // Load API keys
        const keysRes = await fetch('/api/keys');
        const keys = await keysRes.json();
        if (keys && keys.length > 0) {
          const keysEl = document.getElementById('apiKeys');
          keysEl.innerHTML = '<div class="key-item"><div><div class="key-name">Venice AI</div><div class="key-value">Bundled — No key required</div></div><span class="key-status">ACTIVE</span></div>' +
            keys.map(k => `<div class="key-item"><div><div class="key-name">${k.provider}</div><div class="key-value">${k.masked_key}</div></div><span class="key-status">ACTIVE</span></div>`).join('');
        }
      } catch {}
    }

    function showUsage() {
      fetch('/api/wallet').then(r => r.json()).then(data => {
        const txCount = data.transactions?.length || 0;
        const balance = data.balance || 100;
        alert(`Usage Summary:\n\nCredits: ${balance.toFixed(2)}\nTransactions: ${txCount}\nPlan: ${data.plan || 'free_trial'}\n\nVisit /upgrade to add more credits.`);
      });
    }

    function addApiKey() {
      const provider = prompt('Enter provider name (e.g. OpenAI, Anthropic, Venice):');
      if (!provider) return;
      const key = prompt('Enter API key:');
      if (!key) return;
      fetch('/api/keys', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ provider, key }),
      }).then(r => r.json()).then(data => {
        if (data.ok) {
          loadWallet();
        } else {
          alert(data.error || 'Failed to add key');
        }
      });
    }

    loadWallet();
  </script>
</body>
</html>
