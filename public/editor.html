<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Code Editor — Hermes Synth</title>
  <link rel="icon" type="image/png" href="/logo.png?v=4">
  <meta name="theme-color" content="#ffffff">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'JetBrains Mono', 'SF Mono', Menlo, monospace;
      background: #ffffff;
      color: #0f172a;
      min-height: 100vh;
      overflow-x: hidden;
    }
    
    .page { position: relative; z-index: 1; padding: 0 0 80px 0; }
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 24px;
    }
    .topbar .badge {
      background: #ffffff;
      border: 1px solid rgba(0,51,255,0.3);
      color: #0033ff;
      font-size: 11px; font-weight: 600;
      letter-spacing: 2px; text-transform: uppercase;
      padding: 6px 16px; border-radius: 4px;
      display: flex; align-items: center; gap: 8px;
    }
    .topbar .badge img { width: 20px; height: 20px; }
    .topbar .menu-btn {
      background: #ffffff;
      border: 1px solid rgba(0,51,255,0.1);
      color: #0f172a;
      width: 40px; height: 40px; border-radius: 8px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; text-decoration: none;
    }
    .hero { padding: 8px 24px 20px; }
    .hero h1 {
      font-family: 'JetBrains Mono', monospace;
      font-size: 32px; font-weight: 400; line-height: 1.15; color: #0f172a;
    }
    .hero h1 span { color: #0033ff; }
    .hero p {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px; color: rgba(15,23,42,0.5); margin-top: 8px;
    }
    .card {
      margin: 0 24px 16px;
      border: 1px solid rgba(0,51,255,0.08);
      border-radius: 12px; padding: 24px;
      background: #ffffff;
    }
    .card h3 {
      font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
      color: rgba(15,23,42,0.5); margin-bottom: 16px;
    }
    .field { margin-bottom: 20px; }
    .field label {
      display: block; font-size: 11px; letter-spacing: 2px;
      text-transform: uppercase; color: rgba(15,23,42,0.5); margin-bottom: 10px;
    }
    .field input, .field select, .field textarea {
      width: 100%;
      background: #ffffff;
      border: 1px solid rgba(0,51,255,0.12);
      border-radius: 8px; padding: 14px 16px;
      font-size: 14px;
      font-family: 'JetBrains Mono', 'SF Mono', Menlo, monospace;
      color: #0f172a; outline: none;
      transition: border-color 0.2s;
    }
    .field input:focus, .field select:focus, .field textarea:focus { border-color: rgba(0,51,255,0.5); }
    .field input::placeholder, .field textarea::placeholder { color: rgba(15,23,42,0.3); }
    .field select option { background: #ffffff; }
    .field textarea { min-height: 80px; resize: vertical; }
    .btn-primary {
      width: 100%; padding: 14px;
      background: #0033ff;
      color: #ffffff; border: none; border-radius: 8px;
      font-size: 13px; font-weight: 700;
      letter-spacing: 2px; text-transform: uppercase;
      cursor: pointer; transition: opacity 0.2s;
      font-family: 'JetBrains Mono', monospace;
    }
    .btn-primary:hover { opacity: 0.9; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-secondary {
      padding: 10px 20px;
      background: #ffffff;
      border: 1px solid rgba(0,51,255,0.1);
      color: #0f172a; border-radius: 8px;
      font-size: 12px; font-weight: 600;
      cursor: pointer; transition: all 0.2s;
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: 1px; text-transform: uppercase;
    }
    .btn-secondary:hover { border-color: rgba(0,51,255,0.3); }
    .btn-danger {
      padding: 10px 20px;
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.3);
      color: #ef4444; border-radius: 8px;
      font-size: 12px; font-weight: 600;
      cursor: pointer;
      font-family: 'JetBrains Mono', monospace;
    }
    .item-card {
      background: #ffffff;
      border: 1px solid rgba(0,51,255,0.1);
      border-radius: 8px; padding: 16px;
      margin-bottom: 10px; cursor: pointer;
      transition: all 0.2s;
    }
    .item-card:hover { border-color: rgba(0,51,255,0.3); background: rgba(0,51,255,0.05); }
    .item-card .name { font-size: 14px; font-weight: 600; color: #0f172a; }
    .item-card .desc { font-size: 12px; color: rgba(15,23,42,0.5); margin-top: 4px; }
    .item-card .meta { font-size: 10px; color: rgba(15,23,42,0.4); margin-top: 8px; display: flex; gap: 12px; letter-spacing: 1px; text-transform: uppercase; }
    .badge-sm {
      font-size: 9px; padding: 2px 8px; border-radius: 3px;
      font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase;
    }
    .badge-sm.active { background: rgba(52,211,153,0.15); color: #34d399; }
    .badge-sm.paused { background: #ffffff; color: #0033ff; }
    .empty-state {
      text-align: center; padding: 40px 20px; color: rgba(15,23,42,0.4);
    }
    .empty-state h3 { font-size: 16px; color: rgba(15,23,42,0.5); margin-bottom: 8px; font-family: Georgia, serif; }
    .modal-overlay {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85); z-index: 100;
      align-items: center; justify-content: center; padding: 16px;
    }
    .modal-overlay.show { display: flex; }
    .modal {
      background: #ffffff;
      border: 1px solid rgba(0,51,255,0.08);
      border-radius: 12px; padding: 24px;
      width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto;
    }
    .modal h2 { font-family: Georgia, serif; font-size: 20px; margin-bottom: 20px; }
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: #ffffff;
      border-top: 1px solid rgba(0,51,255,0.08);
      display: flex; justify-content: space-around;
      padding: 10px 0 14px; z-index: 10;
    }
    .bottom-nav a {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      text-decoration: none; color: rgba(15,23,42,0.4);
      font-size: 10px; font-family: 'JetBrains Mono', monospace;
      transition: color 0.2s;
    }
    .bottom-nav a:hover, .bottom-nav a.active { color: #0033ff; }
    .bottom-nav img { width: 22px; height: 22px; }
    @media (max-width: 480px) {
      .hero { padding: 8px 12px 12px; }
      .hero h1 { font-size: 22px; }
      .hero p { font-size: 12px; }
      .chat-card { margin: 0 8px; }
      .input-area { padding: 8px 10px; }
    }
    @media (min-width: 768px) {
      .page { max-width: 700px; margin: 0 auto; }
      .bottom-nav { max-width: 600px; left: 50%; transform: translateX(-50%); border-radius: 12px 12px 0 0; }
    }

    .content { padding: 0 24px; max-width: 900px; margin: 0 auto; }
    .create-btn {
      width: 100%; padding: 14px;
      background: #0033ff;
      color: #ffffff; border: none; border-radius: 8px;
      font-size: 13px; font-weight: 700; letter-spacing: 2px;
      text-transform: uppercase; cursor: pointer;
      font-family: 'JetBrains Mono', monospace;
      margin-bottom: 16px; transition: opacity 0.2s;
    }
    .create-btn:hover { opacity: 0.9; }
    .project-card {
      background: #ffffff; border: 1px solid rgba(0,51,255,0.1);
      border-radius: 8px; padding: 16px; margin-bottom: 10px;
      cursor: pointer; transition: all 0.2s;
    }
    .project-card:hover { border-color: rgba(0,51,255,0.3); background: rgba(0,51,255,0.05); }
    .project-card .name { font-size: 14px; font-weight: 600; }
    .project-card .desc { font-size: 12px; color: rgba(15,23,42,0.5); margin-top: 4px; }
    .project-card .meta { font-size: 10px; color: rgba(15,23,42,0.4); margin-top: 8px; display: flex; gap: 12px; }
    .lang-badge { font-size: 9px; padding: 2px 8px; border-radius: 3px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
    .lang-badge.javascript { background: rgba(255,220,50,0.15); color: #0033ff; }
    .lang-badge.python { background: rgba(50,150,255,0.15); color: #3296ff; }
    .empty { text-align: center; padding: 40px 20px; color: rgba(15,23,42,0.4); }
    .empty h3 { font-size: 16px; color: rgba(15,23,42,0.5); margin-bottom: 8px; font-family: Georgia, serif; }
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); z-index: 100; align-items: center; justify-content: center; padding: 16px; }
    .modal-overlay.show { display: flex; }
    .modal { background: #ffffff; border: 1px solid rgba(0,51,255,0.08); border-radius: 12px; padding: 24px; width: 100%; max-width: 450px; }
    .modal h2 { font-family: Georgia, serif; font-size: 20px; margin-bottom: 20px; }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 11px; color: rgba(15,23,42,0.5); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 1.5px; }
    .form-group input, .form-group select {
      width: 100%; background: #ffffff; border: 1px solid rgba(0,51,255,0.12);
      border-radius: 8px; padding: 12px 14px; color: #0f172a; font-size: 14px;
      font-family: 'JetBrains Mono', monospace; outline: none;
    }
    .form-group select option { background: #ffffff; }
    .modal-actions { display: flex; gap: 10px; margin-top: 16px; }
    .modal-actions button { flex: 1; padding: 12px; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: 'JetBrains Mono', monospace; }
    .editor-view { display: none; }
    .editor-toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
    .editor-toolbar button {
      padding: 8px 14px; border: none; border-radius: 8px; font-size: 12px; font-weight: 600;
      cursor: pointer; background: #ffffff; color: #0f172a;
      border: 1px solid rgba(0,51,255,0.1); font-family: 'JetBrains Mono', monospace;
    }
    .editor-toolbar button:hover { border-color: rgba(0,51,255,0.3); }
    .run-btn { background: rgba(0,51,255,0.1) !important; border-color: rgba(0,51,255,0.08) !important; color: #0033ff !important; }
    .file-tabs { display: flex; gap: 2px; margin-bottom: 2px; overflow-x: auto; }
    .file-tab {
      padding: 8px 16px; background: #ffffff;
      border: 1px solid rgba(0,51,255,0.1); border-bottom: none;
      border-radius: 8px 8px 0 0; font-size: 12px; cursor: pointer;
      color: rgba(15,23,42,0.5); white-space: nowrap;
      display: flex; align-items: center; gap: 6px;
    }
    .file-tab.active { background: rgba(0,51,255,0.08); color: #0033ff; border-color: rgba(0,51,255,0.08); }
    .file-tab .close { font-size: 14px; opacity: 0.5; }
    .file-tab .close:hover { opacity: 1; color: #ef4444; }
    .code-editor {
      width: 100%; min-height: 350px; background: #ffffff;
      border: 1px solid rgba(0,51,255,0.1); border-radius: 0 0 8px 8px;
      padding: 12px; color: #0f172a;
      font-family: 'JetBrains Mono', monospace; font-size: 13px; line-height: 1.6;
      resize: vertical; tab-size: 2; white-space: pre; overflow-x: auto;
    }
    .code-editor:focus { outline: none; border-color: rgba(0,51,255,0.5); }
    .output-panel { margin-top: 12px; background: #ffffff; border: 1px solid rgba(0,51,255,0.1); border-radius: 8px; overflow: hidden; }
    .output-header { padding: 8px 12px; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: rgba(15,23,42,0.5); border-bottom: 1px solid rgba(0,51,255,0.08); }
    .output-body { padding: 12px; font-size: 13px; white-space: pre-wrap; color: rgba(15,23,42,0.7); min-height: 60px; }
    .new-file-row { display: flex; gap: 8px; margin-bottom: 12px; }
    .new-file-row input { flex: 1; }
  </style>
  <link rel="stylesheet" href="/responsive.css">
</head>
<body>
  <div class="page">
    <div class="topbar">
      <div class="badge"><img src="/logo.png?v=4" alt="HC">EDITOR</div>
      <a href="/chat" class="menu-btn" title="Dashboard">☰</a>
    </div>
    <div class="hero">
      <h1>Write <span>Code.</span></h1>
      <p>Create projects, edit files, and run code.</p>
    </div>
    <!-- Project List View -->
  <div class="card" id="listView">
    <button class="create-btn" onclick="showCreateProject()">+ New Project</button>
    <div id="projectList"></div>
  </div>

  <!-- Editor View -->
  <div class="content editor-view" id="editorView">
    <div class="editor-toolbar">
      <button onclick="backToProjects()">&larr; Projects</button>
      <span id="projTitle" style="font-weight:600;font-size:14px;flex:1"></span>
      <button class="run-btn" onclick="runCode()">&#9654; Run</button>
      <button onclick="saveFile()">Save</button>
      <button class="btn-danger" onclick="deleteProject()">Delete Project</button>
    </div>
    <div class="new-file-row">
      <input type="text" id="newFileName" placeholder="new_file.js">
      <button onclick="createFile()">+ Add File</button>
    </div>
    <div class="file-tabs" id="fileTabs"></div>
    <textarea class="code-editor" id="codeEditor" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off"></textarea>
    <div class="output-panel">
      <div class="output-header">
        <span>Output</span>
        <span id="exitCode"></span>
      </div>
      <div class="output-body" id="outputBody">Click "Run" to execute your code.</div>
    </div>
  </div>

  <!-- Create Project Modal -->
  <div class="modal-overlay" id="modal">
    <div class="modal">
      <h2>New Project</h2>
      <div class="form-group">
        <label>Project Name</label>
        <input type="text" id="projName" placeholder="my-awesome-project">
      </div>
      <div class="form-group">
        <label>Language</label>
        <select id="projLang">
          <option value="javascript">JavaScript (Node.js)</option>
          <option value="python">Python 3</option>
        </select>
      </div>
      <div class="form-group">
        <label>Description (optional)</label>
        <input type="text" id="projDesc" placeholder="What is this project about?">
      </div>
      <div class="modal-actions">
        <button class="btn-secondary" onclick="closeModal()">Cancel</button>
        <button class="btn-primary" onclick="createProject()">Create</button>
      </div>
    </div>
  </div>
  </div>

  <nav class="bottom-nav">
    <a href="/chat"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>Chat</a>
    <a href="/agents"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="4"/><circle cx="9" cy="16" r="1" fill="currentColor"/><circle cx="15" cy="16" r="1" fill="currentColor"/></svg>Agents</a>
    <a href="/editor" class="active"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>Editor</a>
    <a href="/terminal"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>Terminal</a>
    <a href="/mcp"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M12 12h.01"/><path d="M17 12h.01"/><path d="M7 12h.01"/></svg>MCP</a>
    <a href="/settings"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="3"/><path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>Settings</a>
    <a href="/profile"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>Profile</a>
  </nav>

<script>
    let projects = [];
    let currentProject = null;
    let currentFile = null;
    let fileContents = {};

    async function loadProjects() {
      try {
        const r = await fetch('/api/projects');
        const d = await r.json();
        projects = d.projects || [];
        renderProjects();
      } catch {}
    }

    function renderProjects() {
      const el = document.getElementById('projectList');
      if (!projects.length) {
        el.innerHTML = '<div class="empty"><h3>No Projects</h3><p>Create a project to start coding.</p></div>';
        return;
      }
      el.innerHTML = projects.map(p => `
        <div class="project-card" onclick="openProject('${p.id}')">
          <div style="display:flex;justify-content:space-between;align-items:center">
            <div class="name">${esc(p.name)}</div>
            <span class="lang-badge ${p.language}">${p.language}</span>
          </div>
          ${p.description ? `<div class="desc">${esc(p.description)}</div>` : ''}
          <div class="meta">
            <span>${(p.files || []).length} files</span>
            <span>${p.lastBuild ? 'Last run: ' + timeAgo(p.lastBuild) : 'Never run'}</span>
            <span>Created ${timeAgo(p.createdAt)}</span>
          </div>
        </div>
      `).join('');
    }

    function showCreateProject() { document.getElementById('modal').classList.add('show'); }
    function closeModal() { document.getElementById('modal').classList.remove('show'); }

    async function createProject() {
      const name = document.getElementById('projName').value.trim();
      if (!name) return alert('Project name required');
      const r = await fetch('/api/projects', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, language: document.getElementById('projLang').value, description: document.getElementById('projDesc').value.trim() })
      });
      const d = await r.json();
      if (d.error) return alert(d.error);
      closeModal();
      document.getElementById('projName').value = '';
      document.getElementById('projDesc').value = '';
      await loadProjects();
      if (d.project) openProject(d.project.id);
    }

    async function openProject(id) {
      currentProject = projects.find(p => p.id === id);
      if (!currentProject) return;
      fileContents = {};
      document.getElementById('listView').style.display = 'none';
      document.getElementById('editorView').style.display = 'block';
      document.getElementById('projTitle').textContent = currentProject.name;
      // Load file list
      try {
        const r = await fetch('/api/projects/files', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ projectId: id, action: 'list' })
        });
        const d = await r.json();
        const rawFiles = d.files || currentProject.files || [];
        currentProject.files = rawFiles.map(f => typeof f === 'string' ? f : f.filename);
        rawFiles.forEach(f => { if (typeof f === 'object' && f.filename) fileContents[f.filename] = f.content || ''; });
      } catch {}
      renderTabs();
      if (currentProject.files.length) openFile(currentProject.files[0]);
      else { currentFile = null; document.getElementById('codeEditor').value = ''; }
    }

    function renderTabs() {
      const el = document.getElementById('fileTabs');
      el.innerHTML = (currentProject.files || []).map(f => `
        <div class="file-tab ${f === currentFile ? 'active' : ''}" onclick="openFile('${esc(f)}')">
          ${esc(f)}
          <span class="close" onclick="event.stopPropagation();deleteFile('${esc(f)}')">&times;</span>
        </div>
      `).join('');
    }

    async function openFile(filename) {
      if (currentFile && fileContents[currentFile] !== undefined) {
        fileContents[currentFile] = document.getElementById('codeEditor').value;
      }
      currentFile = filename;
      renderTabs();
      if (fileContents[filename] !== undefined) {
        document.getElementById('codeEditor').value = fileContents[filename];
        return;
      }
      try {
        const r = await fetch('/api/projects/files', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ projectId: currentProject.id, action: 'read', filename })
        });
        const d = await r.json();
        fileContents[filename] = d.content || '';
        document.getElementById('codeEditor').value = fileContents[filename];
      } catch { document.getElementById('codeEditor').value = ''; }
    }

    async function saveFile() {
      if (!currentProject || !currentFile) return;
      const content = document.getElementById('codeEditor').value;
      fileContents[currentFile] = content;
      try {
        await fetch('/api/projects/files', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ projectId: currentProject.id, action: 'write', filename: currentFile, content })
        });
        document.getElementById('outputBody').textContent = `Saved ${currentFile}`;
        document.getElementById('outputBody').className = 'output-body success';
      } catch (e) {
        document.getElementById('outputBody').textContent = `Save error: ${e.message}`;
        document.getElementById('outputBody').className = 'output-body error';
      }
    }

    async function createFile() {
      const name = document.getElementById('newFileName').value.trim();
      if (!name || !currentProject) return;
      try {
        const r = await fetch('/api/projects/files', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ projectId: currentProject.id, action: 'create', filename: name, content: '' })
        });
        const d = await r.json();
        if (d.error) return alert(d.error);
        if (!currentProject.files.includes(name.replace(/[^a-zA-Z0-9._-]/g, '_'))) {
          currentProject.files.push(name.replace(/[^a-zA-Z0-9._-]/g, '_'));
        }
        document.getElementById('newFileName').value = '';
        openFile(name.replace(/[^a-zA-Z0-9._-]/g, '_'));
      } catch {}
    }

    async function deleteFile(filename) {
      if (!confirm(`Delete ${filename}?`)) return;
      await fetch('/api/projects/files', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ projectId: currentProject.id, action: 'delete', filename })
      });
      currentProject.files = currentProject.files.filter(f => f !== filename);
      delete fileContents[filename];
      if (currentFile === filename) {
        currentFile = currentProject.files[0] || null;
        if (currentFile) openFile(currentFile);
        else document.getElementById('codeEditor').value = '';
      }
      renderTabs();
    }

    async function runCode() {
      if (!currentProject || !currentFile) return;
      await saveFile();
      const out = document.getElementById('outputBody');
      const ec = document.getElementById('exitCode');
      out.textContent = 'Running...';
      out.className = 'output-body';
      ec.textContent = '';
      try {
        const r = await fetch('/api/projects/run', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ projectId: currentProject.id, filename: currentFile })
        });
        const d = await r.json();
        if (d.error) {
          out.textContent = d.error;
          out.className = 'output-body error';
        } else {
          out.textContent = d.output || '(no output)';
          out.className = d.exitCode === 0 ? 'output-body success' : 'output-body error';
          ec.textContent = `Exit: ${d.exitCode}`;
          ec.style.color = d.exitCode === 0 ? '#4a4' : '#e44';
        }
      } catch (e) {
        out.textContent = e.message;
        out.className = 'output-body error';
      }
    }

    async function deleteProject() {
      if (!currentProject || !confirm(`Delete project "${currentProject.name}" and all files?`)) return;
      await fetch('/api/projects/delete', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: currentProject.id })
      });
      backToProjects();
    }

    function backToProjects() {
      currentProject = null;
      currentFile = null;
      fileContents = {};
      document.getElementById('editorView').style.display = 'none';
      document.getElementById('listView').style.display = 'block';
      loadProjects();
    }

    // Tab key support in editor
    document.getElementById('codeEditor').addEventListener('keydown', function(e) {
      if (e.key === 'Tab') {
        e.preventDefault();
        const s = this.selectionStart, end = this.selectionEnd;
        this.value = this.value.substring(0, s) + '  ' + this.value.substring(end);
        this.selectionStart = this.selectionEnd = s + 2;
      }
      if (e.ctrlKey && e.key === 's') { e.preventDefault(); saveFile(); }
      if (e.ctrlKey && e.key === 'Enter') { e.preventDefault(); runCode(); }
    });

    function esc(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
    function timeAgo(ts) {
      if (!ts) return 'never';
      const s = Math.floor((Date.now() - ts) / 1000);
      if (s < 60) return 'just now'; if (s < 3600) return Math.floor(s/60) + 'm ago';
      if (s < 86400) return Math.floor(s/3600) + 'h ago'; return Math.floor(s/86400) + 'd ago';
    }

    loadProjects();
  </script>
</body>
</html>
