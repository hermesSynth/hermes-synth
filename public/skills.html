<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skills — Hermes Synth</title>
  <link rel="icon" type="image/png" href="/logo.png?v=4">
  <meta name="theme-color" content="#ffffff">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'JetBrains Mono', 'SF Mono', Menlo, monospace;
      background: #ffffff;
      color: #0f172a;
      min-height: 100vh;
      overflow-x: hidden;
    }
    
    .page { position: relative; z-index: 1; padding: 0 0 80px 0; }
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 24px;
    }
    .topbar .badge {
      background: #ffffff;
      border: 1px solid rgba(0,51,255,0.3);
      color: #0033ff;
      font-size: 11px; font-weight: 600;
      letter-spacing: 2px; text-transform: uppercase;
      padding: 6px 16px; border-radius: 4px;
      display: flex; align-items: center; gap: 8px;
    }
    .topbar .badge img { width: 20px; height: 20px; }
    .topbar .menu-btn {
      background: #ffffff;
      border: 1px solid rgba(0,51,255,0.1);
      color: #0f172a;
      width: 40px; height: 40px; border-radius: 8px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; text-decoration: none;
    }
    .hero { padding: 8px 24px 20px; }
    .hero h1 {
      font-family: 'JetBrains Mono', monospace;
      font-size: 32px; font-weight: 400; line-height: 1.15; color: #0f172a;
    }
    .hero h1 span { color: #0033ff; }
    .hero p {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px; color: rgba(15,23,42,0.5); margin-top: 8px;
    }
    .card {
      margin: 0 24px 16px;
      border: 1px solid rgba(0,51,255,0.08);
      border-radius: 12px; padding: 24px;
      background: #ffffff;
    }
    .card h3 {
      font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
      color: rgba(15,23,42,0.5); margin-bottom: 16px;
    }
    .field { margin-bottom: 20px; }
    .field label {
      display: block; font-size: 11px; letter-spacing: 2px;
      text-transform: uppercase; color: rgba(15,23,42,0.5); margin-bottom: 10px;
    }
    .field input, .field select, .field textarea {
      width: 100%;
      background: #ffffff;
      border: 1px solid rgba(0,51,255,0.12);
      border-radius: 8px; padding: 14px 16px;
      font-size: 14px;
      font-family: 'JetBrains Mono', 'SF Mono', Menlo, monospace;
      color: #0f172a; outline: none;
      transition: border-color 0.2s;
    }
    .field input:focus, .field select:focus, .field textarea:focus { border-color: rgba(0,51,255,0.5); }
    .field input::placeholder, .field textarea::placeholder { color: rgba(15,23,42,0.3); }
    .field select option { background: #ffffff; }
    .field textarea { min-height: 80px; resize: vertical; }
    .btn-primary {
      width: 100%; padding: 14px;
      background: #0033ff;
      color: #ffffff; border: none; border-radius: 8px;
      font-size: 13px; font-weight: 700;
      letter-spacing: 2px; text-transform: uppercase;
      cursor: pointer; transition: opacity 0.2s;
      font-family: 'JetBrains Mono', monospace;
    }
    .btn-primary:hover { opacity: 0.9; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-secondary {
      padding: 10px 20px;
      background: #ffffff;
      border: 1px solid rgba(0,51,255,0.1);
      color: #0f172a; border-radius: 8px;
      font-size: 12px; font-weight: 600;
      cursor: pointer; transition: all 0.2s;
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: 1px; text-transform: uppercase;
    }
    .btn-secondary:hover { border-color: rgba(0,51,255,0.3); }
    .btn-danger {
      padding: 10px 20px;
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.3);
      color: #ef4444; border-radius: 8px;
      font-size: 12px; font-weight: 600;
      cursor: pointer;
      font-family: 'JetBrains Mono', monospace;
    }
    .item-card {
      background: #ffffff;
      border: 1px solid rgba(0,51,255,0.1);
      border-radius: 8px; padding: 16px;
      margin-bottom: 10px; cursor: pointer;
      transition: all 0.2s;
    }
    .item-card:hover { border-color: rgba(0,51,255,0.3); background: rgba(0,51,255,0.05); }
    .item-card .name { font-size: 14px; font-weight: 600; color: #0f172a; }
    .item-card .desc { font-size: 12px; color: rgba(15,23,42,0.5); margin-top: 4px; }
    .item-card .meta { font-size: 10px; color: rgba(15,23,42,0.4); margin-top: 8px; display: flex; gap: 12px; letter-spacing: 1px; text-transform: uppercase; }
    .badge-sm {
      font-size: 9px; padding: 2px 8px; border-radius: 3px;
      font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase;
    }
    .badge-sm.active { background: rgba(52,211,153,0.15); color: #34d399; }
    .badge-sm.paused { background: #ffffff; color: #0033ff; }
    .empty-state {
      text-align: center; padding: 40px 20px; color: rgba(15,23,42,0.4);
    }
    .empty-state h3 { font-size: 16px; color: rgba(15,23,42,0.5); margin-bottom: 8px; font-family: Georgia, serif; }
    .modal-overlay {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85); z-index: 100;
      align-items: center; justify-content: center; padding: 16px;
    }
    .modal-overlay.show { display: flex; }
    .modal {
      background: #ffffff;
      border: 1px solid rgba(0,51,255,0.08);
      border-radius: 12px; padding: 24px;
      width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto;
    }
    .modal h2 { font-family: Georgia, serif; font-size: 20px; margin-bottom: 20px; }
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: #ffffff;
      border-top: 1px solid rgba(0,51,255,0.08);
      display: flex; justify-content: space-around;
      padding: 10px 0 14px; z-index: 10;
    }
    .bottom-nav a {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      text-decoration: none; color: rgba(15,23,42,0.4);
      font-size: 10px; font-family: 'JetBrains Mono', monospace;
      transition: color 0.2s;
    }
    .bottom-nav a:hover, .bottom-nav a.active { color: #0033ff; }
    .bottom-nav img { width: 22px; height: 22px; }
    @media (max-width: 480px) {
      .hero { padding: 8px 12px 12px; }
      .hero h1 { font-size: 22px; }
      .hero p { font-size: 12px; }
      .chat-card { margin: 0 8px; }
      .input-area { padding: 8px 10px; }
    }
    @media (min-width: 768px) {
      .page { max-width: 700px; margin: 0 auto; }
      .bottom-nav { max-width: 600px; left: 50%; transform: translateX(-50%); border-radius: 12px 12px 0 0; }
    }

    .create-form { margin: 0 24px 16px; }
    .form-row { display: flex; gap: 8px; margin-bottom: 8px; }
    .form-row input, .form-row select {
      flex: 1; background: #ffffff; border: 1px solid rgba(0,51,255,0.12);
      border-radius: 8px; padding: 10px 12px; color: #0f172a; font-size: 13px;
      font-family: 'JetBrains Mono', monospace; outline: none;
    }
    .code-area {
      width: 100%; min-height: 80px; background: #ffffff;
      border: 1px solid rgba(0,51,255,0.12); border-radius: 8px;
      padding: 10px 12px; color: #0f172a; font-family: 'JetBrains Mono', monospace;
      font-size: 13px; resize: vertical; outline: none;
    }
    .code-area:focus { border-color: rgba(0,51,255,0.5); }
    .btn { padding: 10px 20px; border: none; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; font-family: 'JetBrains Mono', monospace; }
    .btn-sm { padding: 6px 12px; font-size: 11px; }
    .run { background: #ffffff; color: #0033ff; border: 1px solid rgba(0,51,255,0.08); }
    .danger { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); color: #ef4444; }
    .templates { margin: 0 24px 16px; display: flex; gap: 8px; flex-wrap: wrap; }
    .tpl-btn {
      padding: 8px 14px; background: #ffffff; border: 1px solid rgba(0,51,255,0.1);
      border-radius: 8px; font-size: 11px; cursor: pointer; color: rgba(15,23,42,0.6);
      font-family: 'JetBrains Mono', monospace; transition: all 0.2s;
    }
    .tpl-btn:hover { border-color: rgba(0,51,255,0.3); }
    .skill-card {
      margin: 0 24px 10px; background: #ffffff;
      border: 1px solid rgba(0,51,255,0.1); border-radius: 8px; padding: 14px;
    }
    .skill-card .top { display: flex; justify-content: space-between; align-items: center; }
    .skill-card .actions { display: flex; gap: 6px; }
    .skill-card .code-preview { font-size: 12px; color: rgba(15,23,42,0.5); margin-top: 8px; font-family: 'JetBrains Mono', monospace; }
    .skill-card .output-box { margin-top: 8px; padding: 10px; background: #ffffff; border-radius: 6px; font-size: 12px; white-space: pre-wrap; }
    .empty { text-align: center; padding: 40px 24px; color: rgba(15,23,42,0.4); }
    .spacer { height: 80px; }
  </style>
  <link rel="stylesheet" href="/responsive.css">
</head>
<body>
  <div class="page">
    <div class="topbar">
      <div class="badge"><img src="/logo.png?v=4" alt="HC">SKILLS</div>
      <a href="/chat" class="menu-btn" title="Dashboard">☰</a>
    </div>
    <div class="hero">
      <h1>Agent <span>Skills.</span></h1>
      <p>View and manage agent capabilities.</p>
    </div>
    </div>
  <div class="card">
    <div class="create-form">
      <h3>Create New Skill</h3>
      <div class="form-row">
        <input type="text" id="skillName" placeholder="Skill name">
        <input type="text" id="skillDesc" placeholder="Description (optional)">
      </div>
      <div class="templates">
        <button class="tpl-btn" onclick="loadTemplate('hello')">Hello World</button>
        <button class="tpl-btn" onclick="loadTemplate('time')">Current Time</button>
        <button class="tpl-btn" onclick="loadTemplate('env')">Env Info</button>
        <button class="tpl-btn" onclick="loadTemplate('math')">Math Calc</button>
        <button class="tpl-btn" onclick="loadTemplate('json')">JSON Parse</button>
      </div>
      <textarea class="code-area" id="skillCode" placeholder="// Write JavaScript code here&#10;// Use console.log() for output&#10;console.log('Hello from Hermes Synth!');"></textarea>
      <button class="btn" onclick="createSkill()">Create Skill</button>
    </div>
    <div id="skillList"></div>
  </div>
  <div class="spacer"></div>
  </div>

  <nav class="bottom-nav">
    <a href="/chat" class="active"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>Chat</a>
    <a href="/agents"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="4"/><circle cx="9" cy="16" r="1" fill="currentColor"/><circle cx="15" cy="16" r="1" fill="currentColor"/></svg>Agents</a>
    <a href="/editor"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>Editor</a>
    <a href="/terminal"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>Terminal</a>
    <a href="/mcp"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M12 12h.01"/><path d="M17 12h.01"/><path d="M7 12h.01"/></svg>MCP</a>
    <a href="/settings"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="3"/><path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>Settings</a>
    <a href="/profile"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>Profile</a>
  </nav>

<script>
    function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    function ago(ts) { if(!ts) return 'never'; const d=Date.now()-ts; if(d<60000) return 'just now'; if(d<3600000) return Math.floor(d/60000)+'m ago'; if(d<86400000) return Math.floor(d/3600000)+'h ago'; return Math.floor(d/86400000)+'d ago'; }
    const templates = {
      hello: { name: 'Hello World', code: "console.log('Hello from Hermes Synth!');\nconsole.log('Skill executed at:', new Date().toISOString());" },
      time: { name: 'Current Time', code: "const now = new Date();\nconsole.log('Current UTC:', now.toUTCString());\nconsole.log('Timestamp:', now.getTime());\nconsole.log('ISO:', now.toISOString());" },
      env: { name: 'Environment Info', code: "const os = require('os');\nconsole.log('Platform:', os.platform());\nconsole.log('Arch:', os.arch());\nconsole.log('CPUs:', os.cpus().length);\nconsole.log('Memory:', Math.round(os.totalmem()/1e9) + 'GB');\nconsole.log('Uptime:', Math.round(os.uptime()/3600) + 'h');" },
      math: { name: 'Math Calculator', code: "const a = 42, b = 13;\nconsole.log(`${a} + ${b} = ${a+b}`);\nconsole.log(`${a} * ${b} = ${a*b}`);\nconsole.log(`sqrt(${a}) = ${Math.sqrt(a).toFixed(4)}`);\nconsole.log(`PI = ${Math.PI}`);" },
      json: { name: 'JSON Parse', code: "const data = { agent: 'Hermes Synth', version: '0.14.0', features: ['chat','tasks','browser','cron','skills','terminal'] };\nconsole.log(JSON.stringify(data, null, 2));" }
    };
    function loadTemplate(key) {
      const t = templates[key];
      document.getElementById('skillName').value = t.name;
      document.getElementById('skillCode').value = t.code;
    }
    async function loadSkills() {
      const res = await fetch('/api/skills'); const { skills } = await res.json();
      const el = document.getElementById('skillList');
      if (!skills || !skills.length) { el.innerHTML = '<div class="empty"><p>No skills yet. Create one above or use a template.</p></div>'; return; }
      el.innerHTML = skills.map(s => `
        <div class="skill-card">
          <div class="top"><span class="name">${esc(s.name)}</span><span class="badge ${s.builtin?'builtin':s.trigger||'manual'}">${s.builtin?'BUILT-IN':(s.trigger||'manual').toUpperCase()}</span></div>
          ${s.description ? `<div class="desc">${esc(s.description)}</div>` : ''}
          <div class="meta">Runs: ${s.runs||0} · Last run: ${ago(s.lastRun)} · Created: ${ago(s.createdAt)}</div>
          <div class="code-preview">${esc(s.code)}</div>
          <div class="output-box" id="out-${s.id}"></div>
          <div class="actions">
            <button class="btn-sm run" onclick="runSkill('${s.id}')">▶ Run</button>
            ${!s.builtin ? `<button class="btn-sm danger" onclick="deleteSkill('${s.id}')">Delete</button>` : ''}
          </div>
        
      `).join('');
    }
    async function createSkill() {
      const name = document.getElementById('skillName').value.trim();
      const code = document.getElementById('skillCode').value.trim();
      const description = document.getElementById('skillDesc').value.trim();
      if (!name || !code) return alert('Name and code required');
      await fetch('/api/skills', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({name,code,description,trigger:'manual'}) });
      document.getElementById('skillName').value = ''; document.getElementById('skillCode').value = ''; document.getElementById('skillDesc').value = '';
      loadSkills();
    }
    async function runSkill(id) {
      const outEl = document.getElementById('out-' + id);
      outEl.style.display = 'block'; outEl.textContent = 'Running...';
      const res = await fetch('/api/skills/run', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({id}) });
      const data = await res.json();
      outEl.textContent = data.output || data.error || 'No output';
      outEl.style.color = data.error ? '#f87171' : '#4ade80';
      loadSkills();
    }
    async function deleteSkill(id) { if(!confirm('Delete this skill?')) return; await fetch('/api/skills/delete', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({id}) }); loadSkills(); }
    loadSkills();
  </script>
</body>
</html>
