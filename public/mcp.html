<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>MCP — Hermes Synth</title>
  <link rel="icon" type="image/png" href="/logo.png?v=4">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap">
  <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.1/dist/ethers.umd.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'JetBrains Mono', monospace;
      background: #0a0a0f;
      color: #e2e8f0;
    }
    .hs-main {
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header */
    .header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 20px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      background: #0a0a0f;
      flex-shrink: 0;
    }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .logo { width: 28px; height: 28px; border-radius: 6px; }
    .title { font-size: 14px; font-weight: 600; color: #fff; }
    .chain-badge {
      font-size: 10px; font-weight: 500;
      background: rgba(59,130,246,0.15); color: #60a5fa;
      padding: 3px 8px; border-radius: 4px;
      letter-spacing: 0.5px;
    }
    .wallet-btn {
      font-family: inherit; font-size: 12px; font-weight: 500;
      background: #1e40af; color: #fff;
      border: none; padding: 8px 16px; border-radius: 6px;
      cursor: pointer; transition: background 0.2s;
    }
    .wallet-btn:hover { background: #2563eb; }
    .wallet-btn.connected {
      background: rgba(34,197,94,0.12); color: #4ade80;
      border: 1px solid rgba(34,197,94,0.2);
    }

    /* Balance bar */
    .balance-bar {
      display: none; padding: 10px 20px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      font-size: 11px; color: #94a3b8;
      gap: 16px; align-items: center;
    }
    .balance-bar.show { display: flex; }
    .bal-item { display: flex; gap: 6px; align-items: center; }
    .bal-val { color: #e2e8f0; font-weight: 500; }

    /* Chat area */
    .chat {
      flex: 1; overflow-y: auto; padding: 20px;
      display: flex; flex-direction: column; gap: 12px;
    }
    .chat::-webkit-scrollbar { width: 4px; }
    .chat::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

    .msg {
      max-width: 85%; padding: 10px 14px; border-radius: 12px;
      font-size: 13px; line-height: 1.5; word-break: break-word;
    }
    .msg.user {
      align-self: flex-end;
      background: #1e40af; color: #fff;
      border-bottom-right-radius: 4px;
    }
    .msg.agent {
      align-self: flex-start;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-bottom-left-radius: 4px;
    }
    .msg.system {
      align-self: center;
      background: transparent; color: #64748b;
      font-size: 11px; padding: 4px 0;
    }
    .msg.error {
      align-self: flex-start;
      background: rgba(239,68,68,0.08);
      border: 1px solid rgba(239,68,68,0.2);
      color: #fca5a5;
    }

    /* Confirmation card */
    .confirm-card {
      align-self: flex-start;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px; padding: 16px;
      max-width: 320px; width: 100%;
    }
    .confirm-card .card-title {
      font-size: 11px; font-weight: 600; color: #94a3b8;
      text-transform: uppercase; letter-spacing: 1px;
      margin-bottom: 12px;
    }
    .confirm-card .card-row {
      display: flex; justify-content: space-between;
      padding: 6px 0; font-size: 12px;
    }
    .confirm-card .card-row .label { color: #64748b; }
    .confirm-card .card-row .value { color: #e2e8f0; font-weight: 500; }
    .confirm-card .card-actions {
      display: flex; gap: 8px; margin-top: 14px;
    }
    .confirm-card .btn-confirm {
      flex: 1; font-family: inherit; font-size: 12px; font-weight: 600;
      background: #16a34a; color: #fff;
      border: none; padding: 10px; border-radius: 8px;
      cursor: pointer; transition: background 0.2s;
    }
    .confirm-card .btn-confirm:hover { background: #22c55e; }
    .confirm-card .btn-cancel {
      font-family: inherit; font-size: 12px; font-weight: 500;
      background: rgba(255,255,255,0.05); color: #94a3b8;
      border: 1px solid rgba(255,255,255,0.1);
      padding: 10px 16px; border-radius: 8px;
      cursor: pointer;
    }
    .confirm-card .btn-cancel:hover { background: rgba(255,255,255,0.08); }

    /* Status card (replaces confirm after action) */
    .status-card {
      align-self: flex-start;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px; padding: 14px 16px;
      max-width: 320px; font-size: 12px;
    }
    .status-card.success { border-color: rgba(34,197,94,0.3); }
    .status-card.pending { border-color: rgba(250,204,21,0.3); }
    .status-card a { color: #60a5fa; text-decoration: none; }
    .status-card a:hover { text-decoration: underline; }

    /* Input area */
    .input-area {
      padding: 16px 20px;
      border-top: 1px solid rgba(255,255,255,0.06);
      background: #0a0a0f;
      flex-shrink: 0;
    }
    .input-wrap {
      display: flex; align-items: center; gap: 10px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px; padding: 4px 4px 4px 14px;
    }
    .input-wrap input {
      flex: 1; background: none; border: none; outline: none;
      font-family: inherit; font-size: 13px; color: #e2e8f0;
      padding: 10px 0;
    }
    .input-wrap input::placeholder { color: #475569; }
    .input-wrap button {
      font-family: inherit; font-size: 12px; font-weight: 600;
      background: #1e40af; color: #fff;
      border: none; padding: 10px 18px; border-radius: 8px;
      cursor: pointer; transition: background 0.2s;
    }
    .input-wrap button:hover { background: #2563eb; }
    .input-wrap button:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Hints */
    .hints {
      display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap;
    }
    .hint {
      font-size: 10px; color: #64748b;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.06);
      padding: 4px 8px; border-radius: 4px;
      cursor: pointer; transition: all 0.2s;
    }
    .hint:hover { color: #e2e8f0; border-color: rgba(255,255,255,0.15); }

    @media (max-width: 768px) {
      body { padding-right: 0; }
    }

    /* Welcome */
    .welcome {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; flex: 1; text-align: center;
      padding: 40px 20px; gap: 12px;
    }
    .welcome h2 { font-size: 18px; color: #fff; font-weight: 600; }
    .welcome p { font-size: 12px; color: #64748b; max-width: 300px; line-height: 1.6; }

    @media (max-width: 480px) {
      .header { padding: 10px 14px; }
      .chat { padding: 14px; }
      .input-area { padding: 12px 14px; }
      .msg { max-width: 90%; }
    }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="header">
    <div class="header-left">
      <img class="logo" src="/logo.png?v=4" alt="H">
      <span class="title">MCP</span>
      <span class="chain-badge">BASE</span>
    </div>
    <button class="wallet-btn" id="walletBtn" onclick="connectWallet()">Connect Wallet</button>
  </div>

  <!-- Balance bar -->
  <div class="balance-bar" id="balanceBar">
    <div class="bal-item">ETH: <span class="bal-val" id="balETH">—</span></div>
    <div class="bal-item">USDC: <span class="bal-val" id="balUSDC">—</span></div>
  </div>

  <!-- Chat -->
  <div class="chat" id="chat">
    <div class="welcome" id="welcome">
      <img src="/logo.png?v=4" width="48" height="48" style="border-radius:10px;opacity:0.8">
      <h2>Hermes MCP</h2>
      <p>On-chain wallet operations on Base. Connect your wallet and type a command to get started.</p>
    </div>
  </div>

  <!-- Input -->
  <div class="input-area">
    <div class="input-wrap">
      <input type="text" id="msgInput" placeholder="swap 0.01 ETH to USDC..." autocomplete="off">
      <button id="sendBtn" onclick="handleSend()">Send</button>
    </div>
    <div class="hints">
      <span class="hint" onclick="fillCmd('swap 0.01 ETH to USDC')">swap ETH→USDC</span>
      <span class="hint" onclick="fillCmd('balance')">balance</span>
      <span class="hint" onclick="fillCmd('send 5 USDC to 0x...')">send</span>
      <span class="hint" onclick="fillCmd('shield 10 USDC')">shield</span>
      <span class="hint" onclick="fillCmd('help')">help</span>
    </div>
  </div>

  <script>
    const UNISWAP_ROUTER = '0x2626664c2603336E57B271c5C0b26F421741e481';
    const WETH_ADDRESS = '0x4200000000000000000000000000000000000006';
    const USDC_ADDRESS = '0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913';
    const BASE_CHAIN_ID = '0x2105';
    const ERC20_ABI = ['function approve(address,uint256) returns (bool)', 'function balanceOf(address) view returns (uint256)', 'function decimals() view returns (uint8)', 'function allowance(address,address) view returns (uint256)'];
    const SWAP_ROUTER_ABI = ['function exactInputSingle((address tokenIn, address tokenOut, uint24 fee, address recipient, uint256 amountIn, uint256 amountOutMinimum, uint160 sqrtPriceLimitX96)) external payable returns (uint256 amountOut)', 'function multicall(uint256 deadline, bytes[] data) external payable returns (bytes[])'];

    let provider = null, signer = null, walletAddr = null;

    const chatEl = document.getElementById('chat');
    const msgInput = document.getElementById('msgInput');
    const sendBtn = document.getElementById('sendBtn');

    function addMsg(type, html) {
      const welcome = document.getElementById('welcome');
      if (welcome) welcome.remove();
      const div = document.createElement('div');
      div.className = `msg ${type}`;
      div.innerHTML = html;
      chatEl.appendChild(div);
      chatEl.scrollTop = chatEl.scrollHeight;
      return div;
    }

    function addCard(html) {
      const welcome = document.getElementById('welcome');
      if (welcome) welcome.remove();
      const div = document.createElement('div');
      div.innerHTML = html;
      chatEl.appendChild(div.firstElementChild);
      chatEl.scrollTop = chatEl.scrollHeight;
      return chatEl.lastElementChild;
    }

    function fillCmd(cmd) { msgInput.value = cmd; msgInput.focus(); }

    // Wallet connection
    async function connectWallet() {
      const wp = window.okxwallet || window.ethereum;
      if (!wp) {
        addMsg('error', 'No wallet detected. Open this page in your wallet browser (OKX, MetaMask, etc).');
        return;
      }
      try {
        const accounts = await wp.request({ method: 'eth_requestAccounts' });
        if (!accounts.length) return;
        provider = new ethers.BrowserProvider(wp);
        signer = await provider.getSigner();
        walletAddr = accounts[0];
        await ensureBase();
        document.getElementById('walletBtn').textContent = walletAddr.slice(0,6) + '...' + walletAddr.slice(-4);
        document.getElementById('walletBtn').classList.add('connected');
        document.getElementById('balanceBar').classList.add('show');
        addMsg('system', `Connected: ${walletAddr.slice(0,6)}...${walletAddr.slice(-4)} on Base`);
        loadBalances();
      } catch (e) {
        addMsg('error', 'Connection failed: ' + (e.shortMessage || e.message));
      }
    }

    async function ensureBase() {
      const wp = window.okxwallet || window.ethereum;
      if (!wp) return;
      try {
        await wp.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: BASE_CHAIN_ID }] });
      } catch (e) {
        if (e.code === 4902) {
          await wp.request({ method: 'wallet_addEthereumChain', params: [{ chainId: BASE_CHAIN_ID, chainName: 'Base', nativeCurrency: { name: 'ETH', symbol: 'ETH', decimals: 18 }, rpcUrls: ['https://mainnet.base.org'], blockExplorerUrls: ['https://basescan.org'] }] });
        }
      }
      provider = new ethers.BrowserProvider(wp);
      signer = await provider.getSigner();
    }

    async function loadBalances() {
      if (!provider || !walletAddr) return;
      try {
        const eth = await provider.getBalance(walletAddr);
        document.getElementById('balETH').textContent = parseFloat(ethers.formatEther(eth)).toFixed(4);
        const usdc = new ethers.Contract(USDC_ADDRESS, ERC20_ABI, provider);
        const usdcBal = await usdc.balanceOf(walletAddr);
        document.getElementById('balUSDC').textContent = parseFloat(ethers.formatUnits(usdcBal, 6)).toFixed(2);
      } catch {}
    }

    // Command handling
    function handleSend() {
      const text = msgInput.value.trim();
      if (!text) return;
      msgInput.value = '';
      addMsg('user', escHtml(text));
      parseCommand(text);
    }

    msgInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleSend(); });

    function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    function parseCommand(text) {
      const lower = text.toLowerCase().trim();

      // Help
      if (lower === 'help') {
        addMsg('agent', `<b>MCP Commands:</b><br><br>• <b>swap [amount] [FROM] to [TO]</b><br>&nbsp;&nbsp;e.g. swap 0.01 ETH to USDC<br><br>• <b>send [amount] [TOKEN] to [address]</b><br>&nbsp;&nbsp;e.g. send 5 USDC to 0x1234...<br><br>• <b>shield [amount] USDC</b> — deposit to x402 privacy pool<br>&nbsp;&nbsp;e.g. shield 10 USDC<br><br>• <b>unshield [note JSON] to [address]</b> — withdraw from privacy pool<br>&nbsp;&nbsp;e.g. unshield {"secret":"...","nullifier":"...","amount":10} to 0x1234...<br><br>• <b>balance</b> — check wallet balances<br><br>• <b>help</b> — show this message`);
        return;
      }

      // Balance
      if (lower === 'balance' || lower === 'bal') {
        if (!walletAddr) { addMsg('agent', 'Connect your wallet first.'); return; }
        loadBalances();
        addMsg('agent', `Wallet: ${walletAddr.slice(0,6)}...${walletAddr.slice(-4)}<br>ETH: ${document.getElementById('balETH').textContent}<br>USDC: ${document.getElementById('balUSDC').textContent}`);
        return;
      }

      // Swap
      const swapMatch = lower.match(/^swap\s+([\d.]+)\s+(\w+)\s+(?:to|for|→|->)\s+(\w+)$/);
      if (swapMatch) {
        if (!walletAddr) { addMsg('agent', 'Connect your wallet first.'); return; }
        const [, amount, from, to] = swapMatch;
        showSwapConfirm(amount, from.toUpperCase(), to.toUpperCase());
        return;
      }

      // Send
      const sendMatch = lower.match(/^send\s+([\d.]+)\s+(\w+)\s+to\s+(0x[a-f0-9]{40})$/i);
      if (sendMatch) {
        if (!walletAddr) { addMsg('agent', 'Connect your wallet first.'); return; }
        const [, amount, token, to] = sendMatch;
        showSendConfirm(amount, token.toUpperCase(), to);
        return;
      }

      // Shield (x402 deposit)
      const shieldMatch = lower.match(/^shield\s+(\d+)\s+usdc$/i);
      if (shieldMatch) {
        if (!walletAddr) { addMsg('agent', 'Connect your wallet first.'); return; }
        const amount = parseInt(shieldMatch[1]);
        if (amount !== 10 && amount !== 100 && amount !== 1000) {
          addMsg('agent', 'Shield amount must be 10, 100, or 1000 USDC.'); return;
        }
        showShieldConfirm(amount);
        return;
      }

      // Unshield (x402 withdraw)
      const unshieldMatch = text.match(/^unshield\s+(\{.*\})\s+to\s+(0x[a-f0-9]{40})$/i);
      if (unshieldMatch) {
        if (!walletAddr) { addMsg('agent', 'Connect your wallet first.'); return; }
        try {
          const noteData = JSON.parse(unshieldMatch[1]);
          showUnshieldConfirm(noteData, unshieldMatch[2]);
        } catch { addMsg('agent', 'Invalid note JSON format.'); }
        return;
      }

      // Unknown
      addMsg('agent', 'Unknown command. Type <b>help</b> to see available commands.');
    }

    // Swap confirmation card
    let pendingAction = null;

    function showSwapConfirm(amount, from, to) {
      const cardId = 'card-' + Date.now();
      const feeTier = (from === 'ETH' || to === 'ETH') ? '0.05%' : '0.3%';
      addCard(`
        <div class="confirm-card" id="${cardId}">
          <div class="card-title">Swap Confirmation</div>
          <div class="card-row"><span class="label">From</span><span class="value">${amount} ${from}</span></div>
          <div class="card-row"><span class="label">To</span><span class="value">${to}</span></div>
          <div class="card-row"><span class="label">Network</span><span class="value">Base</span></div>
          <div class="card-row"><span class="label">Fee tier</span><span class="value">${feeTier}</span></div>
          <div class="card-row"><span class="label">Router</span><span class="value">Uniswap V3</span></div>
          <div class="card-actions">
            <button class="btn-confirm" onclick="execSwap('${amount}','${from}','${to}','${cardId}')">Confirm Swap</button>
            <button class="btn-cancel" onclick="cancelCard('${cardId}')">Cancel</button>
          </div>
        </div>
      `);
    }

    function showSendConfirm(amount, token, to) {
      const cardId = 'card-' + Date.now();
      addCard(`
        <div class="confirm-card" id="${cardId}">
          <div class="card-title">Send Confirmation</div>
          <div class="card-row"><span class="label">Amount</span><span class="value">${amount} ${token}</span></div>
          <div class="card-row"><span class="label">To</span><span class="value">${to.slice(0,8)}...${to.slice(-6)}</span></div>
          <div class="card-row"><span class="label">Network</span><span class="value">Base</span></div>
          <div class="card-actions">
            <button class="btn-confirm" onclick="execSend('${amount}','${token}','${to}','${cardId}')">Confirm Send</button>
            <button class="btn-cancel" onclick="cancelCard('${cardId}')">Cancel</button>
          </div>
        </div>
      `);
    }

    function cancelCard(cardId) {
      const card = document.getElementById(cardId);
      if (card) card.innerHTML = '<div style="color:#64748b;font-size:12px;padding:8px 0;">Cancelled.</div>';
    }

    // Execute swap
    async function execSwap(amount, from, to, cardId) {
      const card = document.getElementById(cardId);
      card.innerHTML = '<div class="status-card pending">⏳ Approve transaction in your wallet...</div>';

      try {
        const wp = window.okxwallet || window.ethereum;
        await wp.request({ method: 'eth_requestAccounts' });
        provider = new ethers.BrowserProvider(wp);
        signer = await provider.getSigner();
        await ensureBase();

        const fromAddr = from === 'ETH' ? WETH_ADDRESS : (from === 'USDC' ? USDC_ADDRESS : null);
        const toAddr = to === 'ETH' ? WETH_ADDRESS : (to === 'USDC' ? USDC_ADDRESS : null);
        if (!fromAddr || !toAddr) { card.innerHTML = '<div class="status-card" style="color:#fca5a5;">Unsupported token pair.</div>'; return; }

        const feeTier = (from === 'ETH' || to === 'ETH') ? 500 : 3000;
        const iface = new ethers.Interface(SWAP_ROUTER_ABI);

        let tx;
        if (from === 'ETH') {
          const amountIn = ethers.parseEther(amount);
          const data = iface.encodeFunctionData('exactInputSingle', [{
            tokenIn: WETH_ADDRESS, tokenOut: toAddr, fee: feeTier,
            recipient: walletAddr, amountIn, amountOutMinimum: 0, sqrtPriceLimitX96: 0
          }]);
          tx = await signer.sendTransaction({ to: UNISWAP_ROUTER, data, value: amountIn, gasLimit: 300000n });
        } else if (to === 'ETH') {
          const decimals = from === 'USDC' ? 6 : 18;
          const amountIn = ethers.parseUnits(amount, decimals);
          // Approve
          card.innerHTML = '<div class="status-card pending">⏳ Approving token spend...</div>';
          const token = new ethers.Contract(fromAddr, ERC20_ABI, signer);
          const allowance = await token.allowance(walletAddr, UNISWAP_ROUTER);
          if (allowance < amountIn) {
            const appTx = await token.approve(UNISWAP_ROUTER, amountIn, { gasLimit: 100000n });
            await appTx.wait();
          }
          card.innerHTML = '<div class="status-card pending">⏳ Approve swap in wallet...</div>';
          const swapData = iface.encodeFunctionData('exactInputSingle', [{
            tokenIn: fromAddr, tokenOut: WETH_ADDRESS, fee: feeTier,
            recipient: '0x0000000000000000000000000000000000000002',
            amountIn, amountOutMinimum: 0, sqrtPriceLimitX96: 0
          }]);
          const unwrapData = new ethers.Interface(['function unwrapWETH9(uint256 amountMinimum, address recipient)']).encodeFunctionData('unwrapWETH9', [0, walletAddr]);
          const deadline = Math.floor(Date.now() / 1000) + 300;
          const mcData = iface.encodeFunctionData('multicall', [deadline, [swapData, unwrapData]]);
          tx = await signer.sendTransaction({ to: UNISWAP_ROUTER, data: mcData, gasLimit: 350000n });
        } else {
          const decimals = from === 'USDC' ? 6 : 18;
          const amountIn = ethers.parseUnits(amount, decimals);
          card.innerHTML = '<div class="status-card pending">⏳ Approving token spend...</div>';
          const token = new ethers.Contract(fromAddr, ERC20_ABI, signer);
          const allowance = await token.allowance(walletAddr, UNISWAP_ROUTER);
          if (allowance < amountIn) {
            const appTx = await token.approve(UNISWAP_ROUTER, amountIn, { gasLimit: 100000n });
            await appTx.wait();
          }
          card.innerHTML = '<div class="status-card pending">⏳ Approve swap in wallet...</div>';
          const data = iface.encodeFunctionData('exactInputSingle', [{
            tokenIn: fromAddr, tokenOut: toAddr, fee: feeTier,
            recipient: walletAddr, amountIn, amountOutMinimum: 0, sqrtPriceLimitX96: 0
          }]);
          tx = await signer.sendTransaction({ to: UNISWAP_ROUTER, data, gasLimit: 300000n });
        }

        card.innerHTML = `<div class="status-card pending">⏳ Transaction submitted...<br><a href="https://basescan.org/tx/${tx.hash}" target="_blank">${tx.hash.slice(0,14)}...</a></div>`;
        await tx.wait();
        card.innerHTML = `<div class="status-card success">✓ Swap complete!<br><a href="https://basescan.org/tx/${tx.hash}" target="_blank">View on BaseScan →</a></div>`;
        loadBalances();
      } catch (e) {
        const msg = e.shortMessage || e.message || 'Transaction failed';
        card.innerHTML = `<div class="status-card" style="color:#fca5a5;">✗ ${escHtml(msg)}</div>`;
      }
    }

    // Execute send
    async function execSend(amount, token, to, cardId) {
      const card = document.getElementById(cardId);
      card.innerHTML = '<div class="status-card pending">⏳ Approve in wallet...</div>';

      try {
        const wp = window.okxwallet || window.ethereum;
        await wp.request({ method: 'eth_requestAccounts' });
        provider = new ethers.BrowserProvider(wp);
        signer = await provider.getSigner();
        await ensureBase();

        let tx;
        if (token === 'ETH') {
          tx = await signer.sendTransaction({ to, value: ethers.parseEther(amount), gasLimit: 21000n });
        } else {
          const tokenAddr = token === 'USDC' ? USDC_ADDRESS : null;
          if (!tokenAddr) { card.innerHTML = '<div class="status-card" style="color:#fca5a5;">Unsupported token.</div>'; return; }
          const decimals = token === 'USDC' ? 6 : 18;
          const contract = new ethers.Contract(tokenAddr, ['function transfer(address,uint256) returns (bool)'], signer);
          tx = await contract.transfer(to, ethers.parseUnits(amount, decimals), { gasLimit: 100000n });
        }

        card.innerHTML = `<div class="status-card pending">⏳ Sending...<br><a href="https://basescan.org/tx/${tx.hash}" target="_blank">${tx.hash.slice(0,14)}...</a></div>`;
        await tx.wait();
        card.innerHTML = `<div class="status-card success">✓ Sent ${amount} ${token}!<br><a href="https://basescan.org/tx/${tx.hash}" target="_blank">View on BaseScan →</a></div>`;
        loadBalances();
      } catch (e) {
        const msg = e.shortMessage || e.message || 'Transaction failed';
        card.innerHTML = `<div class="status-card" style="color:#fca5a5;">✗ ${escHtml(msg)}</div>`;
      }
    }

    // --- x402 Privacy Pool Integration ---
    const X402_POOL = '0x9c456CDc58Dd9fAD88A1FEd6f1d06A943c237060';
    const X402_ABI = [
      'function deposit(uint256 commitment, uint256 amount) external',
      'function withdraw(uint256 _secret, uint256 _nullifier, address _recipient, uint256 _amount) external',
      'function getCommitmentAmount(uint256) view returns (uint256)',
      'function nullifierHashes(uint256) view returns (bool)'
    ];
    const FIELD_SIZE = BigInt('21888242871839275222246405745257275088548364400416034343698204186575808495617');

    function x402Hash(a, b) {
      const packed = ethers.solidityPacked(['uint256', 'uint256'], [a, b]);
      return BigInt(ethers.keccak256(packed)) % FIELD_SIZE;
    }

    function showShieldConfirm(amount) {
      const cardId = 'card-' + Date.now();
      addCard(`
        <div class="confirm-card" id="${cardId}">
          <div class="card-title">Shield (x402 Privacy Deposit)</div>
          <div class="card-row"><span class="label">Amount</span><span class="value">${amount} USDC</span></div>
          <div class="card-row"><span class="label">Pool</span><span class="value">x402 Privacy Pool V2</span></div>
          <div class="card-row"><span class="label">Network</span><span class="value">Base</span></div>
          <div class="card-actions">
            <button class="btn-confirm" onclick="execShield(${amount},'${cardId}')">Confirm Shield</button>
            <button class="btn-cancel" onclick="cancelCard('${cardId}')">Cancel</button>
          </div>
        </div>
      `);
    }

    function showUnshieldConfirm(noteData, recipient) {
      const cardId = 'card-' + Date.now();
      addCard(`
        <div class="confirm-card" id="${cardId}">
          <div class="card-title">Unshield (x402 Privacy Withdraw)</div>
          <div class="card-row"><span class="label">Amount</span><span class="value">${noteData.amount} USDC</span></div>
          <div class="card-row"><span class="label">To</span><span class="value">${recipient.slice(0,8)}...${recipient.slice(-6)}</span></div>
          <div class="card-row"><span class="label">Network</span><span class="value">Base</span></div>
          <div class="card-actions">
            <button class="btn-confirm" onclick="execUnshield(JSON.parse(decodeURIComponent('${encodeURIComponent(JSON.stringify(noteData))}')), '${recipient}', '${cardId}')">Confirm Withdraw</button>
            <button class="btn-cancel" onclick="cancelCard('${cardId}')">Cancel</button>
          </div>
        </div>
      `);
    }

    async function execShield(amount, cardId) {
      const card = document.getElementById(cardId);
      card.innerHTML = '<div class="status-card pending">Generating commitment...</div>';
      try {
        const wp = window.okxwallet || window.ethereum;
        provider = new ethers.BrowserProvider(wp);
        signer = await provider.getSigner();
        await ensureBase();

        const bytes = new Uint8Array(31);
        crypto.getRandomValues(bytes);
        const secret = BigInt('0x' + Array.from(bytes).map(b => b.toString(16).padStart(2, '0')).join(''));
        crypto.getRandomValues(bytes);
        const nullifier = BigInt('0x' + Array.from(bytes).map(b => b.toString(16).padStart(2, '0')).join(''));
        const commitment = x402Hash(secret, nullifier);
        const amountWei = BigInt(amount) * BigInt(1e6);

        card.innerHTML = '<div class="status-card pending">Approving USDC spend...</div>';
        const usdc = new ethers.Contract(USDC_ADDRESS, ERC20_ABI, signer);
        const allowance = await usdc.allowance(walletAddr, X402_POOL);
        if (allowance < amountWei) {
          const appTx = await usdc.approve(X402_POOL, amountWei, { gasLimit: 100000n });
          await appTx.wait();
        }

        card.innerHTML = '<div class="status-card pending">Depositing to privacy pool... Approve in wallet.</div>';
        const pool = new ethers.Contract(X402_POOL, X402_ABI, signer);
        const tx = await pool.deposit(commitment, amountWei, { gasLimit: 800000n });
        card.innerHTML = `<div class="status-card pending">Confirming...<br><a href="https://basescan.org/tx/${tx.hash}" target="_blank">${tx.hash.slice(0,14)}...</a></div>`;
        await tx.wait();

        const noteBackup = JSON.stringify({ secret: secret.toString(), nullifier: nullifier.toString(), amount, commitment: commitment.toString() });

        const notes = JSON.parse(localStorage.getItem('x402_notes') || '[]');
        notes.push({ secret: secret.toString(), nullifier: nullifier.toString(), commitment: commitment.toString(), nullifierHash: x402Hash(nullifier, BigInt(1)).toString(), amount, timestamp: Date.now(), txHash: tx.hash, spent: false });
        localStorage.setItem('x402_notes', JSON.stringify(notes));

        card.innerHTML = `<div class="status-card success">Shielded ${amount} USDC!<br><a href="https://basescan.org/tx/${tx.hash}" target="_blank">View on BaseScan</a><br><br><span style="font-size:11px;color:#94a3b8;">Note backup (SAVE THIS):</span><br><code style="font-size:10px;color:#a78bfa;word-break:break-all;user-select:all;">${escHtml(noteBackup)}</code></div>`;
        loadBalances();
      } catch (e) {
        const msg = e.shortMessage || e.reason || e.message || 'Failed';
        card.innerHTML = `<div class="status-card" style="color:#fca5a5;">${escHtml(msg)}</div>`;
      }
    }

    async function execUnshield(noteData, recipient, cardId) {
      const card = document.getElementById(cardId);
      card.innerHTML = '<div class="status-card pending">Verifying note on-chain...</div>';
      try {
        const wp = window.okxwallet || window.ethereum;
        provider = new ethers.BrowserProvider(wp);
        signer = await provider.getSigner();
        await ensureBase();

        const pool = new ethers.Contract(X402_POOL, X402_ABI, signer);
        const secret = BigInt(noteData.secret);
        const nullifier = BigInt(noteData.nullifier);
        const amount = BigInt(noteData.amount) * BigInt(1e6);
        const nullHash = x402Hash(nullifier, BigInt(1));

        const isSpent = await pool.nullifierHashes(nullHash);
        if (isSpent) { card.innerHTML = '<div class="status-card" style="color:#fca5a5;">This note has already been spent!</div>'; return; }

        card.innerHTML = '<div class="status-card pending">Sending withdrawal... Approve in wallet.</div>';
        const tx = await pool.withdraw(secret, nullifier, recipient, amount, { gasLimit: 200000n });
        card.innerHTML = `<div class="status-card pending">Confirming...<br><a href="https://basescan.org/tx/${tx.hash}" target="_blank">${tx.hash.slice(0,14)}...</a></div>`;
        await tx.wait();

        const notes = JSON.parse(localStorage.getItem('x402_notes') || '[]');
        const commitment = x402Hash(secret, nullifier);
        const idx = notes.findIndex(n => n.commitment === commitment.toString());
        if (idx >= 0) { notes[idx].spent = true; localStorage.setItem('x402_notes', JSON.stringify(notes)); }

        card.innerHTML = `<div class="status-card success">Unshielded ${noteData.amount} USDC to ${recipient.slice(0,8)}...<br><a href="https://basescan.org/tx/${tx.hash}" target="_blank">View on BaseScan</a></div>`;
        loadBalances();
      } catch (e) {
        const msg = e.shortMessage || e.reason || e.message || 'Failed';
        card.innerHTML = `<div class="status-card" style="color:#fca5a5;">${escHtml(msg)}</div>`;
      }
    }

    // Auto-connect on load
    (async () => {
      const wp = window.okxwallet || window.ethereum;
      if (wp) {
        try {
          const accts = await wp.request({ method: 'eth_accounts' });
          if (accts.length) {
            provider = new ethers.BrowserProvider(wp);
            signer = await provider.getSigner();
            walletAddr = accts[0];
            document.getElementById('walletBtn').textContent = walletAddr.slice(0,6) + '...' + walletAddr.slice(-4);
            document.getElementById('walletBtn').classList.add('connected');
            document.getElementById('balanceBar').classList.add('show');
            loadBalances();
          }
        } catch {}
      }
    })();
  </script>

  <script src="/sidebar.js?v=2"></script>
</body>
</html>
